name: Pruebas de itostack

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: itostack
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Dependencias
        run: |
          pip install -r requirements-dev.txt
          cd scripts && npm ci || npm install
          npx playwright install --with-deps chromium
      - name: Tipos TypeScript
        run: cd scripts && npx tsc --noEmit -p .
      - name: Lint de arquitectura sobre el propio plugin
        run: python3 guardias/lint_itosturre.py scripts hooks evals/autoprueba.py evals/compuerta_holdout.py
      - name: Pruebas
        run: python3 -m pytest tests -q
      - name: Autoprueba de evals
        run: python3 evals/autoprueba.py
