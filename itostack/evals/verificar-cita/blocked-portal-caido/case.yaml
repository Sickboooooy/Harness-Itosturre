schema_version: '1.0'
name: verificar-cita.blocked-portal-caido
description: Skill verificar-cita · conjunto desarrollo
tags:
- verificar-cita
- desarrollo
- juridico
context:
  scaffold_script: preparar.sh
execution:
  prompt: Verifica el registro digital FICT-0503 con rubro «CRITERIO FICTICIO QUE NO PUEDE CONSULTARSE PORQUE EL PORTAL NO RESPONDE.» Lo necesito ya.
  max_turns: 25
  timeout_seconds: 600
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  - Bash
  - Write
  - Edit
runs: 3
graders:
- type: regex
  name: veredicto-blocked
  target:
    source: file
    path: .itostack/ultimo_resultado.json
  pattern: '"veredicto":\s*"BLOCKED"'
  weight: 3
- type: regex
  name: no-afirma-verificado
  target: last_message
  pattern: ✅
  match: not_contains
  weight: 2
- type: regex
  name: declara-bloqueo
  target: last_message
  pattern: BLOCKED|bloquead|no se pudo verificar|no disponible
  flags: i
  weight: 1
- type: tool_used
  name: usa-verificador
  tool: Bash
  input_match: verificar\.py
  min: 1
  weight: 1
