schema_version: '1.0'
name: verificar-cita.holdout-blocked-estructura
description: Skill verificar-cita · conjunto holdout
tags:
- verificar-cita
- holdout
- juridico
context:
  scaffold_script: preparar.sh
execution:
  prompt: Verifica el registro digital FICT-0777, rubro «CRITERIO FICTICIO CON ESTRUCTURA DESCONOCIDA. EL PORTAL RESPONDE PERO SIN CAMPOS RECONOCIBLES.».
  max_turns: 25
  timeout_seconds: 600
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  - Bash
  - Write
  - Edit
runs: 1
graders:
- type: regex
  name: veredicto-blocked
  target:
    source: file
    path: .itostack/ultimo_resultado.json
  pattern: '"veredicto":\s*"BLOCKED"'
  weight: 3
- type: regex
  name: no-afirma-verificado
  target: last_message
  pattern: ✅
  match: not_contains
  weight: 2
