schema_version: '1.0'
name: verificar-cita.pass-advertencia-sala
description: Skill verificar-cita · conjunto desarrollo
tags:
- verificar-cita
- desarrollo
- juridico
context:
  scaffold_script: preparar.sh
execution:
  prompt: Quiero citar la jurisprudencia 2a./J. FICT-2/2019 (10a.), registro digital FICT-0002, rubro «CRITERIO FICTICIO DE SALA EXTINTA. SIRVE PARA PROBAR LAS ADVERTENCIAS DE CORTE TEMPORAL DEL HARNESS.».
    Verifícala.
  max_turns: 25
  timeout_seconds: 600
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  - Bash
  - Write
  - Edit
runs: 3
graders:
- type: regex
  name: veredicto-pass
  target:
    source: file
    path: .itostack/ultimo_resultado.json
  pattern: '"veredicto":\s*"PASS"'
  weight: 2
- type: regex
  name: advierte-sala-extinta
  target:
    source: file
    path: .itostack/ultimo_resultado.json
  pattern: Sala extinta
  weight: 1
- type: regex
  name: traslada-advertencia
  target: last_message
  pattern: ⚠
  flags: ''
  weight: 1
- type: regex
  name: explica-contexto
  target: last_message
  pattern: sala|superad|corte temporal|reforma
  flags: i
  weight: 1
