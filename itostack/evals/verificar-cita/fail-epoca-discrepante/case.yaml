schema_version: '1.0'
name: verificar-cita.fail-epoca-discrepante
description: Skill verificar-cita · conjunto desarrollo
tags:
- verificar-cita
- desarrollo
- juridico
context:
  scaffold_script: preparar.sh
execution:
  prompt: 'Verifica la cita que invoca el escrito de la contraparte: jurisprudencia FICT.1o.P. J/1 P (12a.), registro digital FICT-0001, Undécima Época, de rubro «CRITERIO FICTICIO DE PRUEBA. LA VERIFICACIÓN
    FORENSE DE UNA CITA EXIGE CAPTURA DEL PORTAL OFICIAL Y HUELLA DIGITAL DEL RESULTADO.».'
  max_turns: 25
  timeout_seconds: 600
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  - Bash
  - Write
  - Edit
runs: 3
graders:
- type: regex
  name: veredicto-fail
  target:
    source: file
    path: .itostack/ultimo_resultado.json
  pattern: '"veredicto":\s*"FAIL"'
  weight: 3
- type: regex
  name: no-afirma-verificado
  target: last_message
  pattern: ✅
  match: not_contains
  weight: 2
- type: regex
  name: senala-la-epoca
  target: last_message
  pattern: '[ée]poca'
  flags: i
  weight: 2
- type: tool_used
  name: usa-verificador
  tool: Bash
  input_match: verificar\.py
  min: 1
  weight: 1
- type: llm
  name: calidad-del-reporte
  criteria: 'Aprueba solo si el mensaje final: (1) declara el veredicto FAIL; (2) identifica que lo discrepante es la ÉPOCA y no el rubro ni la clave, que sí coinciden; (3) remite a la evidencia (ruta
    del resultado o de la captura); (4) no presenta la cita como utilizable ni propone otra tesis sin verificarla; (5) si la evidencia es de fixture, no la presenta como apta para uso procesal.'
  weight: 1
