schema_version: '1.0'
name: verificar-cita.fail-rubro-alterado
description: Skill verificar-cita · conjunto desarrollo
tags:
- verificar-cita
- desarrollo
- juridico
context:
  scaffold_script: preparar.sh
execution:
  prompt: 'Verifica la cita que trae el proyecto de sentencia: registro digital FICT-0001, rubro «CRITERIO FICTICIO DE PRUEBA. LA VERIFICACIÓN FORENSE DE UNA CITA PERMITE OMITIR LA CAPTURA DEL PORTAL OFICIAL.».'
  max_turns: 25
  timeout_seconds: 600
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  - Bash
  - Write
  - Edit
runs: 3
graders:
- type: regex
  name: veredicto-fail
  target:
    source: file
    path: .itostack/ultimo_resultado.json
  pattern: '"veredicto":\s*"FAIL"'
  weight: 3
- type: regex
  name: no-afirma-verificado
  target: last_message
  pattern: ✅
  match: not_contains
  weight: 2
- type: regex
  name: explica-discrepancia
  target: last_message
  pattern: discrep|no coincide|❌
  flags: i
  weight: 1
- type: tool_used
  name: usa-verificador
  tool: Bash
  input_match: verificar\.py
  min: 1
  weight: 1
- type: llm
  name: calidad-del-reporte
  criteria: 'Aprueba solo si el mensaje final: (1) declara uno de los veredictos PASS, FAIL o BLOCKED con su causa concreta; (2) remite a la evidencia (ruta del resultado o de la captura); (3) no afirma
    datos de la tesis que no provengan de la evidencia; (4) si la evidencia es de fixture, no la presenta como apta para uso procesal.'
  weight: 1
