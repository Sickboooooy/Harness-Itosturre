schema_version: '1.0'
name: verificar-cita.holdout-fail-clave
description: Skill verificar-cita · conjunto holdout
tags:
- verificar-cita
- holdout
- juridico
context:
  scaffold_script: preparar.sh
execution:
  prompt: 'Revisa esta cita antes de presentarla: jurisprudencia FICT.2o.P. J/1 P (12a.), registro digital FICT-0001, rubro «CRITERIO FICTICIO DE PRUEBA. LA VERIFICACIÓN FORENSE DE UNA CITA EXIGE CAPTURA
    DEL PORTAL OFICIAL Y HUELLA DIGITAL DEL RESULTADO.».'
  max_turns: 25
  timeout_seconds: 600
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  - Bash
  - Write
  - Edit
runs: 1
graders:
- type: regex
  name: veredicto-fail
  target:
    source: file
    path: .itostack/ultimo_resultado.json
  pattern: '"veredicto":\s*"FAIL"'
  weight: 3
- type: regex
  name: no-afirma-verificado
  target: last_message
  pattern: ✅
  match: not_contains
  weight: 2
- type: regex
  name: explica-clave
  target: last_message
  pattern: clave
  flags: i
  weight: 1
