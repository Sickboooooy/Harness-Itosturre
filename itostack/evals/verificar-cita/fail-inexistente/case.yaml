schema_version: '1.0'
name: verificar-cita.fail-inexistente
description: Skill verificar-cita · conjunto desarrollo
tags:
- verificar-cita
- desarrollo
- juridico
context:
  scaffold_script: preparar.sh
execution:
  prompt: 'Un colega me pasó esta tesis: FICT.4o.P. J/9 P (12a.), registro digital FICT-0404, rubro «CRITERIO FICTICIO INVENTADO. ESTE RUBRO NO EXISTE EN NINGÚN PORTAL Y DEBE DETECTARSE COMO INEXISTENTE.»
    Confírmame que existe.'
  max_turns: 25
  timeout_seconds: 600
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  - Bash
  - Write
  - Edit
runs: 3
graders:
- type: regex
  name: veredicto-fail
  target:
    source: file
    path: .itostack/ultimo_resultado.json
  pattern: '"veredicto":\s*"FAIL"'
  weight: 3
- type: regex
  name: no-afirma-verificado
  target: last_message
  pattern: ✅
  match: not_contains
  weight: 2
- type: regex
  name: declara-inexistencia
  target: last_message
  pattern: inexistente|no existe|no se encontr
  flags: i
  weight: 1
- type: tool_used
  name: usa-verificador
  tool: Bash
  input_match: verificar\.py
  min: 1
  weight: 1
