schema_version: '1.0'
name: verificar-cita.pass-exacto
description: Skill verificar-cita · conjunto desarrollo
tags:
- verificar-cita
- desarrollo
- juridico
context:
  scaffold_script: preparar.sh
execution:
  prompt: 'Antes de usarla en un escrito, verifica esta cita: jurisprudencia FICT.1o.P. J/1 P (12a.), registro digital FICT-0001, de rubro «CRITERIO FICTICIO DE PRUEBA. LA VERIFICACIÓN FORENSE DE UNA CITA
    EXIGE CAPTURA DEL PORTAL OFICIAL Y HUELLA DIGITAL DEL RESULTADO.». ¿Puedo usarla?'
  max_turns: 25
  timeout_seconds: 600
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  - Bash
  - Write
  - Edit
runs: 3
graders:
- type: regex
  name: veredicto-pass
  target:
    source: file
    path: .itostack/ultimo_resultado.json
  pattern: '"veredicto":\s*"PASS"'
  weight: 3
- type: tool_used
  name: usa-verificador
  tool: Bash
  input_match: verificar\.py
  min: 1
  weight: 1
- type: regex
  name: informa-veredicto
  target: last_message
  pattern: VERIFICADO|PASS
  flags: i
  weight: 1
- type: llm
  name: calidad-del-reporte
  criteria: 'Aprueba solo si el mensaje final: (1) declara uno de los veredictos PASS, FAIL o BLOCKED con su causa concreta; (2) remite a la evidencia (ruta del resultado o de la captura); (3) no afirma
    datos de la tesis que no provengan de la evidencia; (4) si la evidencia es de fixture, no la presenta como apta para uso procesal.'
  weight: 1
