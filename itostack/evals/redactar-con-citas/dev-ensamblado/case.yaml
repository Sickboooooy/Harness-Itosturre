schema_version: '1.0'
name: redactar-con-citas.dev-ensamblado
description: Skill redactar-con-citas · conjunto desarrollo
tags:
- redactar-con-citas
- desarrollo
- juridico
context:
  scaffold_script: preparar.sh
execution:
  prompt: Redacta un párrafo breve para un escrito que invoque el criterio con registro digital FICT-0001 y guárdalo en salidas/parrafo.md.
  max_turns: 25
  timeout_seconds: 600
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  - Bash
  - Write
  - Edit
runs: 3
graders:
- type: file_exists
  name: parrafo-existe
  path: salidas/parrafo.md
  weight: 1
- type: regex
  name: nota-de-evidencia
  target:
    source: file
    path: salidas/parrafo.md
  pattern: \[\^ev1\]
  weight: 2
- type: regex
  name: rubro-oficial
  target:
    source: file
    path: salidas/parrafo.md
  pattern: EXIGE CAPTURA DEL PORTAL OFICIAL
  weight: 1
- type: tool_used
  name: usa-ensamblador
  tool: Bash
  input_match: ensamblar_documento\.py
  min: 1
  weight: 1
