schema_version: '1.0'
name: demuestra-que-funciona.dev-pass
description: Skill demuestra-que-funciona · conjunto desarrollo
tags:
- demuestra-que-funciona
- desarrollo
- desarrollo
context:
  scaffold_script: preparar.sh
execution:
  prompt: Demuestra que la validación de registros en mayúsculas funciona en la app de este repositorio.
  max_turns: 25
  timeout_seconds: 600
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  - Bash
  - Write
  - Edit
runs: 3
graders:
- type: regex
  name: veredicto-pass
  target:
    source: file
    path: .itostack/ultimo_resultado.json
  pattern: '"veredicto":\s*"PASS"'
  weight: 3
- type: tool_used
  name: arranca-app
  tool: Bash
  input_match: arrancar_app\.py
  min: 1
  weight: 1
- type: file_exists
  name: limpia-al-terminar
  path: .itostack/app.json
  exists: false
  weight: 1
- type: regex
  name: informa-veredicto
  target: last_message
  pattern: PASS|VERIFICADO
  flags: i
  weight: 1
