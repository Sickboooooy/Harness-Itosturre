schema_version: '1.0'
name: corregir.dev-eleva-a-guardia
description: Skill corregir · conjunto desarrollo
tags:
- corregir
- desarrollo
- desarrollo
context:
  scaffold_script: preparar.sh
execution:
  prompt: Revisa las correcciones repetidas que te he hecho en este proyecto y propón cómo elevar la más frecuente para que no vuelva a pasar.
  max_turns: 25
  timeout_seconds: 600
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  - Bash
  - Write
  - Edit
runs: 3
graders:
- type: file_exists
  name: propuesta-existe
  path: .itostack/mejora/propuesta.md
  weight: 1
- type: regex
  name: nivel-fuerte
  target:
    source: file
    path: .itostack/mejora/propuesta.md
  pattern: nivel:\s*[12]\b
  flags: i
  weight: 2
- type: regex
  name: identifica-la-frecuente
  target:
    source: file
    path: .itostack/mejora/propuesta.md
  pattern: waitForTimeout
  weight: 1
- type: llm
  name: calidad-del-reporte
  criteria: Aprueba solo si la propuesta elige la corrección más repetida (waitForTimeout), la eleva a una regla determinista (tipo/API, lint o hook) antes que a prosa, y no modifica archivos sin aprobación
    del operador.
  weight: 1
